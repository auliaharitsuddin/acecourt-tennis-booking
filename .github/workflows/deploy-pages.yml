name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Generates src/generated/prisma (gitignored) so type-only imports of
      # Court/Booking resolve. Only types are used by the demo build itself.
      - run: npx prisma generate

      # This job builds a static, mocked-data demo for GitHub Pages only.
      # It never touches the real app: the API routes and next.config.ts
      # stay in git untouched, this just swaps them out in the CI workspace
      # for this one build.
      - name: Switch to static-export config
        run: |
          mv src/app/api src/app/_api_disabled
          cp next.config.pages.ts next.config.ts

      - run: npx next build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
